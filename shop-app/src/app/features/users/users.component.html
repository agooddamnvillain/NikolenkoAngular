<h2>Users</h2>

<ul>
  @if (users$ | async; as users) {
    @for (user of users; track user.id) {
      <li (click)="selectUser(user.id)" style="cursor:pointer;">
        {{ user.name }}
      </li>
    }
  }
</ul>

<h2>Posts</h2>

@if (posts$ | async; as posts) {

  <div>
    @for (post of posts; track post.id) {
      <div class="post">
        <h4>{{ post.title }}</h4>
        <p>{{ post.body }}</p>
      </div>
    }
  </div>

} @else {
  <p>Loading posts...</p>
}
