<!-- 🔹 Фільтри -->
<div class="filters">

    <!-- Пошук -->
    <input 
      #searchInput
      type="text" 
      placeholder="Пошук..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onFilterChange()"
    />
  
    <!-- Select по категорії -->
    <select 
      [(ngModel)]="selectedCategory"
      (ngModelChange)="onFilterChange()"
    >
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  
    <!-- Reset -->
    <button (click)="resetFilters(searchInput)">
      Очистити фільтри
    </button>
  
  </div>
  
  <!-- 🔹 AsyncPipe + Loading -->
  @if (products$ | async; as products) {
  
    <div class="grid">
      @for (item of products; track item.id) {
        <shop-card 
          [item]="item"
          (action)="handleCardAction($event)">
        </shop-card>
      }
    </div>
  
  } @else {
  
    <!-- Loader під час delay(1000) -->
    <div class="loading">
      <p>Loading...</p>
    </div>
  
  }
